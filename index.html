<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Union Admin Portal — Prototype</title>
<meta name="description" content="Click-through prototype of the proposed Union Admin Portal navigation.">
<!-- Keep this out of search results. The repo is public so the URL is shareable,
     but the page should not be indexable. This meta tag is what actually works on
     a GitHub Pages project site — see robots.txt for why that file alone isn't enough. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠</text></svg>">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="app">

  <!-- ── Sidebar ─────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/" title="Back to the union overview">
      <div class="brand-mark">♠</div>
      <div class="brand-text">
        <div class="brand-title">Union Admin Portal</div>
        <div class="brand-sub">WPT Home Game</div>
      </div>
    </a>

    <div class="union-switch">
      <div class="union-switch-label">Union</div>
      <div class="union-switch-value">
        <span>Bellota Labs Union</span>
        <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="union-switch-meta">8 clubs · master club #104829</div>
    </div>

    <nav class="nav" id="nav" aria-label="Main"></nav>

    <div class="sidebar-foot">
      <div class="who">
        <div class="who-avatar">KC</div>
        <div class="who-text">
          <div class="who-name">Kurtis Cheng</div>
          <div class="who-role">Union Owner</div>
        </div>
      </div>
      <div class="proto-note">Prototype · sample data only</div>
    </div>
  </aside>

  <!-- ── Main ────────────────────────────────────────────── -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle navigation">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
      <div class="topbar-right">
        <div class="search-shell">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input type="search" placeholder="Search clubs, members, games…" aria-label="Global search">
        </div>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle colour theme" title="Toggle light / dark">
          <svg class="ico-moon" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M16 12.2A6.6 6.6 0 017.8 4a6.8 6.8 0 108.2 8.2z" fill="currentColor"/></svg>
          <svg class="ico-sun" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><circle cx="10" cy="10" r="3.6" fill="currentColor"/><path d="M10 2.4v2M10 15.6v2M2.4 10h2M15.6 10h2M4.6 4.6l1.4 1.4M14 14l1.4 1.4M15.4 4.6L14 6M6 14l-1.4 1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <div class="page" id="page" tabindex="-1"></div>
  </main>

</div>

<div class="scrim" id="scrim" hidden></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
